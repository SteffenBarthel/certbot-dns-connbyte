[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "certbot-dns-connbyte"
version = "0.1.1"
description = "ConnByte DNS Authenticator plugin for Certbot"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "ConnByte", email = "team@connbyte.com" }]
requires-python = ">=3.9"
dependencies = ["certbot>=2.0", "requests>=2.20"]
classifiers = [
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://connbyte.com/"
"API documentation" = "https://api.connbyte.com/"
Repository = "https://github.com/SteffenBarthel/certbot-dns-connbyte"
Issues = "https://github.com/SteffenBarthel/certbot-dns-connbyte/issues"

[project.entry-points."certbot.plugins"]
dns-connbyte = "certbot_dns_connbyte.dns_connbyte:Authenticator"

[project.optional-dependencies]
test = ["pytest", "requests-mock"]

[tool.setuptools]
packages = ["certbot_dns_connbyte"]
